<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" width="100%" height="100%">
  <defs>
    <!-- Midnight Indigo Hood & Cloak -->
    <linearGradient id="hoodDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="45%" stop-color="#1e1b4b"/>
      <stop offset="85%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Toxic Green Venom Glow -->
    <linearGradient id="toxicVenom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bbf7d0"/>
      <stop offset="40%" stop-color="#4ade80"/>
      <stop offset="80%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <radialGradient id="poisonAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#86efac" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#22c55e" stop-opacity="0.6"/>
      <stop offset="80%" stop-color="#0f766e" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0"/>
    </radialGradient>

    <!-- Fair Soft Skin Tone -->
    <linearGradient id="serenitySkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>

    <filter id="venomGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Poisonous Vapor Mist -->
  <circle cx="160" cy="200" r="130" fill="url(#poisonAura)" opacity="0.25" filter="url(#venomGlow)"/>

  <!-- Ground Shadow with Toxic Vapor -->
  <ellipse cx="160" cy="405" rx="70" ry="12" fill="#000000" opacity="0.6"/>
  <ellipse cx="160" cy="405" rx="50" ry="8" fill="#22c55e" opacity="0.3" filter="url(#venomGlow)"/>

  <!-- ================= BODY & ASSASSIN SUIT ================= -->
  <!-- Midnight Hooded Mantle flowing behind -->
  <path d="M125,160 Q85,250 80,380 Q110,365 130,330 Q128,240 135,160 Z" fill="url(#hoodDark)"/>
  <path d="M195,160 Q235,250 240,380 Q210,365 190,330 Q192,240 185,160 Z" fill="url(#hoodDark)"/>

  <!-- Slender Legs in Dark Wraps -->
  <!-- Left Leg -->
  <g>
    <path d="M142,280 L138,350 L134,395 L154,395 L156,350 L154,280 Z" fill="url(#hoodDark)"/>
    <line x1="138" y1="310" x2="154" y2="310" stroke="#4c1d95" stroke-width="1.8"/>
    <line x1="136" y1="340" x2="155" y2="340" stroke="#4c1d95" stroke-width="1.8"/>
    <path d="M132,392 Q144,388 156,392 L154,402 L130,402 Z" fill="#0f172a"/>
  </g>
  <!-- Right Leg -->
  <g>
    <path d="M166,280 L164,350 L166,395 L186,395 L182,350 L178,280 Z" fill="url(#hoodDark)"/>
    <line x1="166" y1="310" x2="182" y2="310" stroke="#4c1d95" stroke-width="1.8"/>
    <line x1="164" y1="340" x2="183" y2="340" stroke="#4c1d95" stroke-width="1.8"/>
    <path d="M164,392 Q176,388 188,392 L190,402 L162,402 Z" fill="#0f172a"/>
  </g>

  <!-- Form-Fitting Assassin Bodysuit & Corset -->
  <path d="M140,210 L180,210 L188,285 L132,285 Z" fill="url(#hoodDark)"/>
  <!-- Silver-Purple Skull Medallion on Belt -->
  <ellipse cx="160" cy="245" rx="8" ry="7" fill="#cbd5e1"/>
  <circle cx="157" cy="244" r="1.5" fill="#1e1b4b"/>
  <circle cx="163" cy="244" r="1.5" fill="#1e1b4b"/>
  <path d="M156,248 L164,248" stroke="#1e1b4b" stroke-width="1"/>

  <!-- Slender Chest & Neck with Deep Purple Bindings -->
  <path d="M142,160 Q160,155 178,160 L180,215 Q160,218 140,215 Z" fill="url(#hoodDark)"/>
  <path d="M148,165 Q160,162 172,165 L170,195 Q160,198 150,195 Z" fill="#1e1b4b"/>

  <!-- Left Arm: Gripping Poison Dagger (Reverse Grip) -->
  <path d="M136,170 L105,215 L114,222 L142,185 Z" fill="url(#hoodDark)"/>
  <polygon points="100,215 114,226 108,232 94,220" fill="#cbd5e1"/>
  <!-- Left Toxic Dagger pointing down -->
  <g transform="translate(95, 225) rotate(35)" filter="url(#venomGlow)">
    <polygon points="0,0 20,0 15,100 10,110 5,100" fill="#1e293b"/>
    <polygon points="5,5 15,5 12,95 10,105 8,95" fill="url(#toxicVenom)"/>
    <!-- Venom Droplets dripping -->
    <circle cx="10" cy="115" r="2.5" fill="#4ade80"/>
    <circle cx="10" cy="125" r="1.5" fill="#86efac"/>
  </g>

  <!-- Right Arm: Poised Gracefully with Right Dagger -->
  <path d="M184,170 L215,215 L206,222 L178,185 Z" fill="url(#hoodDark)"/>
  <polygon points="212,215 226,226 220,232 206,220" fill="#cbd5e1"/>
  <!-- Right Toxic Dagger -->
  <g transform="translate(220, 225) rotate(-35)" filter="url(#venomGlow)">
    <polygon points="0,0 20,0 15,100 10,110 5,100" fill="#1e293b"/>
    <polygon points="5,5 15,5 12,95 10,105 8,95" fill="url(#toxicVenom)"/>
    <!-- Venom Droplets -->
    <circle cx="10" cy="115" r="2.5" fill="#4ade80"/>
  </g>

  <!-- ================= HEAD, ANIME FACE & VEIL ================= -->
  <!-- Neck -->
  <path d="M154,140 L154,158 L166,158 L166,140 Z" fill="url(#serenitySkin)"/>

  <!-- Delicate Oval Anime Face Contour -->
  <path d="M146,105 Q142,126 148,142 L160,154 L172,142 Q178,126 174,105 Z" fill="url(#serenitySkin)"/>

  <!-- Soft Blush Peeking Through Veil -->
  <ellipse cx="148" cy="128" rx="5" ry="3" fill="#f43f5e" opacity="0.35"/>
  <ellipse cx="172" cy="128" rx="5" ry="3" fill="#f43f5e" opacity="0.35"/>

  <!-- Translucent Purple Lower-Face Sheer Veil (半透明轻纱) -->
  <path d="M145,126 Q160,130 175,126 L170,152 Q160,155 150,152 Z" fill="#581c87" opacity="0.6"/>
  <path d="M148,130 Q160,134 172,130 L168,148 Q160,150 152,148 Z" fill="#7e22ce" opacity="0.45"/>

  <!-- GOLDEN-AMBER ALLURING EYES (琥珀金神秘幽冥眸) -->
  <!-- Left Eye -->
  <g>
    <path d="M146,118 Q152,114 157,119 Q151,126 146,118 Z" fill="#ffffff"/>
    <ellipse cx="152" cy="120" rx="4" ry="4.5" fill="#78350f"/>
    <ellipse cx="152" cy="120" rx="3" ry="3.5" fill="#eab308"/>
    <!-- Highlights -->
    <circle cx="150" cy="118" r="1.5" fill="#ffffff"/>
    <circle cx="153.5" cy="122.5" r="1" fill="#fef08a"/>
    <!-- Soft Eyelash -->
    <path d="M144,118 Q151,113 158,118" stroke="#1e1b4b" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M145,112 Q151,109 157,113" stroke="#312e81" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Right Eye -->
  <g>
    <path d="M163,119 Q168,114 174,118 Q169,126 163,119 Z" fill="#ffffff"/>
    <ellipse cx="168" cy="120" rx="4" ry="4.5" fill="#78350f"/>
    <ellipse cx="168" cy="120" rx="3" ry="3.5" fill="#eab308"/>
    <!-- Highlights -->
    <circle cx="166" cy="118" r="1.5" fill="#ffffff"/>
    <circle cx="169.5" cy="122.5" r="1" fill="#fef08a"/>
    <!-- Soft Eyelash -->
    <path d="M162,118 Q169,113 176,118" stroke="#1e1b4b" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M163,113 Q169,109 175,112" stroke="#312e81" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  </g>

  <!-- ================= MIDNIGHT HOOD & DARK HAIR ================= -->
  <!-- Dark Indigo Hair Bangs under hood -->
  <path d="M146,96 Q154,110 152,118 Q156,108 160,98 Z" fill="#1e1b4b"/>
  <path d="M160,98 Q166,110 168,118 Q170,108 174,96 Z" fill="#1e1b4b"/>

  <!-- Flowing Midnight Hood enveloping head and shoulders -->
  <path d="M136,80 Q160,55 184,80 Q200,105 192,150 Q182,145 178,110 Q160,100 142,110 Q138,145 128,150 Q120,105 136,80 Z" fill="url(#hoodDark)"/>
  <!-- Hood Peak and Edge Highlights -->
  <path d="M138,82 Q160,58 182,82" stroke="#4338ca" stroke-width="1.5" fill="none"/>

  <!-- Swirling Toxic Mist Particles & Bubbles -->
  <g filter="url(#venomGlow)">
    <circle cx="95" cy="160" r="3.5" fill="#4ade80" opacity="0.8"/>
    <circle cx="225" cy="150" r="3" fill="#86efac" opacity="0.8"/>
    <circle cx="70" cy="270" r="4" fill="#22c55e" opacity="0.6"/>
    <circle cx="250" cy="280" r="3.5" fill="#4ade80" opacity="0.7"/>
    <circle cx="160" cy="380" r="3" fill="#86efac"/>
  </g>
</svg>
