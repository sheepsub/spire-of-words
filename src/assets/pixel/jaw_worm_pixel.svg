<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Jaw Worm / 下颚蠕虫 16-bit Pixel Art -->
  <!-- Ground Shadow -->
  <ellipse cx="24" cy="43" rx="16" ry="4" fill="#000000" opacity="0.5" shape-rendering="geometricPrecision"/>

  <!-- Worm Body Tail & Segments (Curled on ground) -->
  <rect x="6" y="36" width="6" height="5" fill="#451a03"/>
  <rect x="7" y="35" width="4" height="6" fill="#78350f"/>
  <rect x="9" y="34" width="7" height="6" fill="#92400e"/>
  <rect x="10" y="33" width="7" height="7" fill="#b45309"/>
  <!-- Armor Ridge 1 -->
  <rect x="8" y="32" width="2" height="4" fill="#d97706"/>
  <rect x="12" y="30" width="2" height="4" fill="#d97706"/>

  <!-- Mid Segments -->
  <rect x="14" y="30" width="8" height="9" fill="#78350f"/>
  <rect x="15" y="28" width="8" height="10" fill="#92400e"/>
  <rect x="16" y="26" width="9" height="11" fill="#b45309"/>
  <!-- Dorsal Spikes -->
  <rect x="17" y="23" width="2" height="4" fill="#f59e0b"/>
  <rect x="18" y="21" width="1" height="3" fill="#fde68a"/>
  <rect x="22" y="20" width="2" height="5" fill="#f59e0b"/>
  <rect x="23" y="18" width="1" height="3" fill="#fde68a"/>

  <!-- Upper Segment Rising Up -->
  <rect x="20" y="22" width="12" height="14" fill="#92400e"/>
  <rect x="22" y="19" width="12" height="13" fill="#b45309"/>
  <rect x="24" y="16" width="11" height="13" fill="#d97706"/>
  <rect x="27" y="14" width="2" height="4" fill="#f59e0b"/>
  <rect x="28" y="12" width="1" height="3" fill="#fde68a"/>

  <!-- Head / Open Gaping Maw Structure -->
  <rect x="26" y="16" width="14" height="14" fill="#78350f"/>
  <rect x="28" y="14" width="13" height="16" fill="#b45309"/>
  <rect x="30" y="12" width="11" height="18" fill="#451a03"/>

  <!-- Inner Mouth (Dark Void) -->
  <rect x="33" y="15" width="8" height="12" fill="#180404"/>
  <rect x="35" y="17" width="5" height="8" fill="#2d0a0a"/>

  <!-- Upper Jaw & Horns -->
  <rect x="28" y="11" width="12" height="5" fill="#92400e"/>
  <rect x="30" y="9" width="9" height="3" fill="#b45309"/>
  <rect x="32" y="7" width="6" height="3" fill="#d97706"/>
  <rect x="34" y="6" width="3" height="2" fill="#f59e0b"/>
  <!-- Upper Teeth (Sharp Yellow/White Pixels) -->
  <rect x="34" y="15" width="2" height="3" fill="#fef08a"/>
  <rect x="35" y="18" width="1" height="1" fill="#ffffff"/>
  <rect x="38" y="15" width="2" height="4" fill="#fef08a"/>
  <rect x="39" y="19" width="1" height="1" fill="#ffffff"/>

  <!-- Lower Jaw (Protruding Massive Mandible) -->
  <rect x="30" y="27" width="12" height="6" fill="#78350f"/>
  <rect x="32" y="29" width="10" height="4" fill="#92400e"/>
  <rect x="35" y="32" width="7" height="3" fill="#b45309"/>
  <!-- Lower Teeth (Sharp Tusk-like Upward Teeth) -->
  <rect x="34" y="24" width="2" height="4" fill="#fef08a"/>
  <rect x="35" y="23" width="1" height="1" fill="#ffffff"/>
  <rect x="38" y="23" width="2" height="5" fill="#fef08a"/>
  <rect x="39" y="22" width="1" height="1" fill="#ffffff"/>

  <!-- Menacing Glowing Eyes on Sides -->
  <rect x="29" y="17" width="3" height="2" fill="#dc2626"/>
  <rect x="30" y="17" width="1" height="1" fill="#fef08a"/>
  <rect x="27" y="19" width="2" height="2" fill="#ef4444"/>
  <rect x="27" y="19" width="1" height="1" fill="#fef08a"/>

  <!-- Rocky Segment Plates Highlight -->
  <rect x="18" y="31" width="4" height="2" fill="#f59e0b"/>
  <rect x="23" y="25" width="4" height="2" fill="#f59e0b"/>
  <rect x="12" y="36" width="3" height="1" fill="#f59e0b"/>
</svg>
