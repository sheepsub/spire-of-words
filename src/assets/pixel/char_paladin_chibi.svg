<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Stardew Valley Chibi: Iron Paladin / 达里安 -->
  <!-- Heavy Ground Shadow -->
  <ellipse cx="24" cy="45" rx="14" ry="3.5" fill="#000000" opacity="0.5" shape-rendering="geometricPrecision"/>

  <!-- Plated Metal Sabatons (Boots) -->
  <rect x="17" y="41" width="5" height="4" fill="#334155"/>
  <rect x="17" y="43" width="6" height="2" fill="#64748b"/>
  <rect x="26" y="41" width="5" height="4" fill="#334155"/>
  <rect x="25" y="43" width="6" height="2" fill="#64748b"/>

  <!-- Massive Holy Tower Shield on Left Side (Iconic Stardew Guardian) -->
  <rect x="4" y="21" width="12" height="23" fill="#1e293b"/>
  <rect x="5" y="22" width="10" height="21" fill="#475569"/>
  <rect x="6" y="23" width="8" height="19" fill="#94a3b8"/>
  <rect x="7" y="24" width="6" height="17" fill="#cbd5e1"/>
  <!-- Golden Holy Crest / Cross on Shield -->
  <rect x="9" y="27" width="2" height="11" fill="#ca8a04"/>
  <rect x="7" y="30" width="6" height="2" fill="#ca8a04"/>
  <rect x="9" y="28" width="2" height="9" fill="#facc15"/>
  <rect x="7" y="30" width="6" height="1" fill="#fef08a"/>
  <!-- Shield Metallic Rim Highlight -->
  <rect x="4" y="21" width="12" height="1" fill="#f8fafc"/>
  <rect x="4" y="21" width="1" height="23" fill="#f8fafc"/>

  <!-- Heavy Chibi Plate Armor Torso -->
  <rect x="16" y="29" width="16" height="12" fill="#334155"/>
  <rect x="18" y="30" width="12" height="11" fill="#64748b"/>
  <rect x="19" y="31" width="10" height="9" fill="#94a3b8"/>
  <rect x="20" y="32" width="8" height="7" fill="#cbd5e1"/>
  <!-- Gold Armor Trimming & Belt -->
  <rect x="17" y="38" width="14" height="2" fill="#ca8a04"/>
  <rect x="23" y="37" width="3" height="4" fill="#fde047"/>

  <!-- Right Arm Resting on Sword Hilt -->
  <rect x="32" y="30" width="4" height="6" fill="#64748b"/>
  <rect x="33" y="35" width="4" height="4" fill="#94a3b8"/>
  <rect x="35" y="32" width="2" height="12" fill="#334155"/>
  <rect x="34" y="31" width="4" height="2" fill="#ca8a04"/>

  <!-- Red Cape Behind -->
  <rect x="14" y="25" width="20" height="9" fill="#991b1b"/>
  <rect x="13" y="30" width="22" height="11" fill="#b91c1c"/>

  <!-- BIG CHIBI HEAD with Paladin Helmet Visor Raised -->
  <rect x="14" y="11" width="20" height="18" fill="#ffedd5"/>
  <rect x="15" y="10" width="18" height="20" fill="#fed7aa"/>

  <!-- Resolute Big Chibi Eyes with sparkles -->
  <!-- Left Eye -->
  <rect x="18" y="18" width="3" height="5" fill="#0f172a"/>
  <rect x="19" y="18" width="1" height="2" fill="#ffffff"/>
  <!-- Right Eye -->
  <rect x="27" y="18" width="3" height="5" fill="#0f172a"/>
  <rect x="28" y="18" width="1" height="2" fill="#ffffff"/>

  <!-- Cute Brave Cheeks & Determined Smile -->
  <rect x="16" y="23" width="3" height="2" fill="#f43f5e" opacity="0.65"/>
  <rect x="29" y="23" width="3" height="2" fill="#f43f5e" opacity="0.65"/>
  <rect x="23" y="24" width="3" height="1" fill="#991b1b"/>

  <!-- Silver Knight Helmet with Cheek Guards -->
  <rect x="12" y="6" width="24" height="9" fill="#475569"/>
  <rect x="13" y="7" width="22" height="7" fill="#64748b"/>
  <rect x="14" y="8" width="20" height="5" fill="#94a3b8"/>
  <rect x="11" y="13" width="4" height="9" fill="#64748b"/>
  <rect x="33" y="13" width="4" height="9" fill="#64748b"/>
  <!-- Golden Helmet Crown Trim -->
  <rect x="14" y="13" width="20" height="2" fill="#ca8a04"/>
  <rect x="23" y="12" width="2" height="3" fill="#fde047"/>

  <!-- Fluffy Crimson Plume Feather on Top of Helmet -->
  <rect x="22" y="1" width="4" height="6" fill="#b91c1c"/>
  <rect x="23" y="0" width="4" height="5" fill="#ef4444"/>
  <rect x="24" y="2" width="5" height="3" fill="#f87171"/>
</svg>
