<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" width="100%" height="100%">
  <defs>
    <!-- Lilac Pink Hair Gradient -->
    <linearGradient id="mashHair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5d0fe"/>
      <stop offset="40%" stop-color="#e879f9"/>
      <stop offset="85%" stop-color="#c026d3"/>
      <stop offset="100%" stop-color="#86198f"/>
    </linearGradient>

    <!-- Black & Violet Bodysuit -->
    <linearGradient id="suitDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="60%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="suitPurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="60%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>

    <!-- Silver Armor -->
    <linearGradient id="mashSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e2e8f0"/>
      <stop offset="80%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Shield Gunmetal & Sapphire Glow -->
    <linearGradient id="shieldMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="40%" stop-color="#334155"/>
      <stop offset="80%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="shieldAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="1"/>
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#312e81" stop-opacity="0"/>
    </radialGradient>

    <filter id="barrierGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Lord Camelot Fortress Barrier Dome (Translucent Glowing Shield) -->
  <path d="M40,390 Q160,80 280,390" fill="none" stroke="url(#shieldAura)" stroke-width="12" opacity="0.35" filter="url(#barrierGlow)"/>
  <path d="M55,395 Q160,110 265,395" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>

  <!-- Ground Shadow -->
  <ellipse cx="170" cy="405" rx="75" ry="12" fill="#000000" opacity="0.6"/>
  <ellipse cx="90" cy="405" rx="45" ry="10" fill="#38bdf8" opacity="0.3" filter="url(#barrierGlow)"/>

  <!-- ================= THE GIGANTIC LORD CAMELOT CROSS SHIELD ================= -->
  <!-- Left Side: Massive Towering Round-Table Fortress Shield -->
  <g transform="translate(30, 80)">
    <!-- Shield Outer Silhouette (Heavy Beveled Gunmetal Plate) -->
    <path d="M10,0 L90,0 Q98,150 96,310 L6,310 Q4,150 10,0 Z" fill="url(#shieldMetal)"/>
    <path d="M14,4 L86,4 Q94,150 92,306 L10,306 Q8,150 14,4 Z" fill="#18181b"/>
    <path d="M18,8 L82,8 Q88,150 86,302 L14,302 Q12,150 18,8 Z" fill="url(#shieldMetal)"/>

    <!-- Silver Armor Rim on Shield -->
    <path d="M8,0 L92,0 L90,12 L10,12 Z" fill="url(#mashSilver)"/>
    <path d="M4,300 L96,300 L94,312 L6,312 Z" fill="url(#mashSilver)"/>
    <path d="M8,10 L14,10 L10,300 L4,300 Z" fill="url(#mashSilver)"/>
    <path d="M92,10 L86,10 L90,300 L96,300 Z" fill="url(#mashSilver)"/>

    <!-- Round-Table Bolts & Rivets -->
    <circle cx="18" cy="18" r="3" fill="url(#mashSilver)"/>
    <circle cx="82" cy="18" r="3" fill="url(#mashSilver)"/>
    <circle cx="16" cy="150" r="3" fill="url(#mashSilver)"/>
    <circle cx="84" cy="150" r="3" fill="url(#mashSilver)"/>
    <circle cx="18" cy="292" r="3" fill="url(#mashSilver)"/>
    <circle cx="82" cy="292" r="3" fill="url(#mashSilver)"/>

    <!-- Glowing Lord Camelot Cross Energy Emblem -->
    <g filter="url(#barrierGlow)">
      <!-- Vertical Beam of Holy Cross -->
      <polygon points="45,20 55,20 57,280 43,280" fill="#38bdf8"/>
      <polygon points="48,22 52,22 53,278 47,278" fill="#ffffff"/>
      <!-- Horizontal Crossbar -->
      <polygon points="20,85 80,85 80,105 20,105" fill="#38bdf8"/>
      <polygon points="22,88 78,88 78,102 22,102" fill="#ffffff"/>
      <!-- Center Glowing Sapphire Relic Gem -->
      <polygon points="50,80 62,95 50,110 38,95" fill="#e0f2fe"/>
      <circle cx="50" cy="95" r="4" fill="#ffffff"/>
    </g>
  </g>

  <!-- ================= MASH KYRIELIGHT FIGURE ================= -->
  <!-- Slender Armored Legs & High-Tech Greaves -->
  <!-- Left Leg -->
  <g>
    <path d="M152,270 L148,340 L144,395 L164,395 L168,340 L166,270 Z" fill="url(#suitDark)"/>
    <!-- Silver Thigh Armor Plating -->
    <polygon points="149,275 167,275 166,310 148,310" fill="url(#mashSilver)"/>
    <!-- Silver Knee Guard & Greave -->
    <polygon points="144,325 170,325 166,350 148,350" fill="url(#mashSilver)"/>
    <!-- Black Combat Boot with Silver Rim -->
    <path d="M140,392 Q154,388 166,392 L164,402 L138,402 Z" fill="#18181b"/>
    <line x1="140" y1="395" x2="164" y2="395" stroke="url(#mashSilver)" stroke-width="2"/>
  </g>
  <!-- Right Leg -->
  <g>
    <path d="M182,270 L180,340 L184,395 L204,395 L200,340 L196,270 Z" fill="url(#suitDark)"/>
    <!-- Silver Thigh Armor Plating -->
    <polygon points="181,275 197,275 196,310 180,310" fill="url(#mashSilver)"/>
    <!-- Silver Knee Guard -->
    <polygon points="178,325 204,325 200,350 182,350" fill="url(#mashSilver)"/>
    <!-- Right Boot -->
    <path d="M180,392 Q194,388 206,392 L208,402 L178,402 Z" fill="#18181b"/>
    <line x1="180" y1="395" x2="204" y2="395" stroke="url(#mashSilver)" stroke-width="2"/>
  </g>

  <!-- Form-Fitting Bodysuit & Belt (Dark with Violet Accents) -->
  <path d="M148,210 L196,210 L202,275 L144,275 Z" fill="url(#suitDark)"/>
  <!-- Violet Accent Stripes on Hips & Waist -->
  <path d="M146,240 L198,240 L196,252 L148,252 Z" fill="url(#suitPurple)"/>
  <rect x="166" y="240" width="12" height="12" fill="url(#mashSilver)"/>

  <!-- Silver Cuirass & Chest Armor with Violet Trim -->
  <path d="M146,160 Q172,152 198,160 L202,215 Q172,220 144,215 Z" fill="url(#suitDark)"/>
  <!-- Silver Breastplate Front -->
  <path d="M152,165 Q172,160 192,165 L190,195 Q172,200 154,195 Z" fill="url(#mashSilver)"/>
  <!-- Purple Energy Lines on Chest -->
  <path d="M168,170 L176,170 L172,190 Z" fill="url(#suitPurple)"/>

  <!-- Silver Pauldrons (Shoulders) -->
  <path d="M144,155 Q130,150 126,175 Q138,185 148,172 Z" fill="url(#mashSilver)"/>
  <path d="M198,155 Q212,150 216,175 Q204,185 194,172 Z" fill="url(#mashSilver)"/>

  <!-- Left Arm Gripping Shield Handle -->
  <path d="M136,165 L108,195 L116,205 L140,180 Z" fill="url(#suitDark)"/>
  <rect x="104" y="190" width="16" height="16" fill="url(#mashSilver)" rx="2"/>

  <!-- Right Arm Poised with Silver Gauntlet -->
  <path d="M204,165 L225,200 L218,210 L198,180 Z" fill="url(#suitDark)"/>
  <polygon points="220,198 232,212 226,220 215,206" fill="url(#mashSilver)"/>

  <!-- ================= HEAD & ANIME FACE ================= -->
  <path d="M164,140 L164,155 L180,155 L180,140 Z" fill="#ffedd5"/>

  <!-- Cute Oval Anime Face Contour -->
  <path d="M154,106 Q150,126 158,142 L172,154 L184,142 Q192,126 188,106 Z" fill="#fff7ed"/>

  <!-- Gentle Blush -->
  <ellipse cx="156" cy="130" rx="5" ry="3" fill="#f43f5e" opacity="0.35"/>
  <ellipse cx="186" cy="130" rx="5" ry="3" fill="#f43f5e" opacity="0.35"/>

  <!-- Nose & Sweet Anime Mouth -->
  <path d="M172,128 L173,131 L171,132" stroke="#d97706" stroke-width="1" fill="none"/>
  <path d="M168,138 Q172,141 176,138" stroke="#be123c" stroke-width="1.4" fill="none" stroke-linecap="round"/>

  <!-- RIGHT EYE: VIOLET CRYSTAL (紫水晶般清澈的右眼) -->
  <g>
    <path d="M176,119 Q181,114 187,118 Q182,126 176,119 Z" fill="#ffffff"/>
    <ellipse cx="181.5" cy="120" rx="4" ry="4.5" fill="#4c1d95"/>
    <ellipse cx="181.5" cy="120" rx="3" ry="3.5" fill="#8b5cf6"/>
    <!-- Highlights -->
    <circle cx="179.5" cy="118" r="1.5" fill="#ffffff"/>
    <circle cx="183.5" cy="122.5" r="1" fill="#e9d5ff"/>
    <!-- Eyelash & Brow -->
    <path d="M175,118 Q182,113 189,118" stroke="#2e1065" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M176,113 Q182,109 189,112" stroke="#86198f" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  </g>

  <!-- ================= MASH'S ICONIC LILAC-PINK HAIR ================= -->
  <!-- Back Bob Hair -->
  <path d="M146,95 Q140,115 146,145 Q154,135 152,110 Z" fill="url(#mashHair)"/>
  <path d="M196,95 Q202,115 198,145 Q190,135 192,110 Z" fill="url(#mashHair)"/>
  <path d="M148,82 Q172,68 194,82 L196,105 Q172,100 146,105 Z" fill="url(#mashHair)"/>

  <!-- Left Side Sweep covering Left Eye (标志性斜刘海遮掩单眼) -->
  <path d="M148,88 Q158,105 152,130 Q160,120 162,100 Z" fill="url(#mashHair)"/>
  <!-- The Center/Left Fringe sweeping across left eye -->
  <path d="M152,88 Q166,108 158,138 Q168,122 172,100 Z" fill="url(#mashHair)"/>
  <path d="M162,88 Q174,106 172,126 Q178,112 180,95 Z" fill="url(#mashHair)"/>
  <!-- Right Fringe Strand -->
  <path d="M188,88 Q196,108 194,132 Q190,118 186,100 Z" fill="url(#mashHair)"/>

  <!-- Floating Fortress Sparks & Ether -->
  <g filter="url(#barrierGlow)">
    <circle cx="110" cy="130" r="2.5" fill="#38bdf8"/>
    <circle cx="230" cy="140" r="2" fill="#c084fc"/>
    <circle cx="260" cy="260" r="2.5" fill="#38bdf8"/>
    <circle cx="130" cy="350" r="2" fill="#ffffff"/>
  </g>
</svg>
