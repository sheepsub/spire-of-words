<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Gremlin Nob / 地精大块头 16-bit Pixel Art -->
  <!-- Heavy Ground Shadow -->
  <ellipse cx="24" cy="45" rx="18" ry="3.5" fill="#000000" opacity="0.6" shape-rendering="geometricPrecision"/>

  <!-- Giant Spiked Stone Club (Behind / in hand) -->
  <rect x="36" y="8" width="8" height="14" fill="#334155"/>
  <rect x="37" y="6" width="6" height="17" fill="#475569"/>
  <rect x="38" y="7" width="4" height="15" fill="#64748b"/>
  <!-- Spikes on Club -->
  <rect x="34" y="9" width="3" height="2" fill="#e2e8f0"/>
  <rect x="33" y="10" width="2" height="1" fill="#f8fafc"/>
  <rect x="44" y="12" width="3" height="2" fill="#e2e8f0"/>
  <rect x="46" y="13" width="2" height="1" fill="#f8fafc"/>
  <rect x="34" y="17" width="3" height="2" fill="#e2e8f0"/>
  <!-- Club Wooden Handle -->
  <rect x="37" y="23" width="3" height="18" fill="#78350f"/>
  <rect x="38" y="24" width="2" height="17" fill="#92400e"/>
  <rect x="36" y="32" width="5" height="2" fill="#451a03"/>

  <!-- Thick Muscular Legs & Feet -->
  <rect x="11" y="37" width="6" height="7" fill="#7f1d1d"/>
  <rect x="10" y="42" width="8" height="3" fill="#450a0a"/>
  <rect x="23" y="37" width="6" height="7" fill="#991b1b"/>
  <rect x="23" y="42" width="8" height="3" fill="#450a0a"/>
  <!-- Claws on Toes -->
  <rect x="9" y="44" width="2" height="1" fill="#fef08a"/>
  <rect x="22" y="44" width="2" height="1" fill="#fef08a"/>

  <!-- Barbarian Belt / Loincloth -->
  <rect x="13" y="33" width="15" height="5" fill="#451a03"/>
  <rect x="15" y="34" width="11" height="6" fill="#78350f"/>
  <rect x="18" y="34" width="4" height="2" fill="#eab308"/>
  <rect x="14" y="37" width="13" height="3" fill="#292524"/>

  <!-- Massive Red Muscular Torso -->
  <rect x="10" y="20" width="22" height="14" fill="#7f1d1d"/>
  <rect x="12" y="18" width="18" height="15" fill="#991b1b"/>
  <rect x="14" y="19" width="14" height="13" fill="#b91c1c"/>
  <!-- Defined Chest / Abs Highlight -->
  <rect x="14" y="21" width="5" height="4" fill="#dc2626"/>
  <rect x="21" y="21" width="5" height="4" fill="#dc2626"/>
  <rect x="15" y="27" width="4" height="4" fill="#dc2626"/>
  <rect x="21" y="27" width="4" height="4" fill="#dc2626"/>

  <!-- Left Arm (Clenched Fist Raised) -->
  <rect x="4" y="20" width="7" height="6" fill="#991b1b"/>
  <rect x="3" y="24" width="6" height="7" fill="#b91c1c"/>
  <!-- Spiked Bracer -->
  <rect x="2" y="28" width="7" height="3" fill="#451a03"/>
  <rect x="1" y="29" width="2" height="1" fill="#e2e8f0"/>
  <!-- Fist -->
  <rect x="3" y="31" width="6" height="5" fill="#dc2626"/>
  <rect x="4" y="34" width="4" height="2" fill="#7f1d1d"/>

  <!-- Right Arm (Grasping Club) -->
  <rect x="30" y="20" width="7" height="6" fill="#991b1b"/>
  <rect x="33" y="24" width="6" height="6" fill="#b91c1c"/>
  <!-- Hand gripping Club -->
  <rect x="35" y="28" width="5" height="5" fill="#dc2626"/>

  <!-- Head & Enraged Face -->
  <rect x="14" y="10" width="13" height="9" fill="#991b1b"/>
  <rect x="15" y="9" width="11" height="10" fill="#b91c1c"/>
  <rect x="16" y="11" width="9" height="7" fill="#dc2626"/>

  <!-- Horns (Curving Demonic Horns) -->
  <rect x="13" y="7" width="3" height="4" fill="#ca8a04"/>
  <rect x="11" y="4" width="3" height="4" fill="#eab308"/>
  <rect x="9" y="2" width="3" height="3" fill="#fde047"/>
  <rect x="8" y="1" width="2" height="2" fill="#fef9c3"/>

  <rect x="25" y="7" width="3" height="4" fill="#ca8a04"/>
  <rect x="27" y="4" width="3" height="4" fill="#eab308"/>
  <rect x="29" y="2" width="3" height="3" fill="#fde047"/>
  <rect x="31" y="1" width="2" height="2" fill="#fef9c3"/>

  <!-- Burning Eyes (Rage Glow) -->
  <rect x="16" y="12" width="3" height="2" fill="#fef08a"/>
  <rect x="17" y="12" width="1" height="2" fill="#ef4444"/>
  <rect x="22" y="12" width="3" height="2" fill="#fef08a"/>
  <rect x="23" y="12" width="1" height="2" fill="#ef4444"/>

  <!-- Roaring Fanged Mouth -->
  <rect x="17" y="15" width="7" height="3" fill="#1e1b4b"/>
  <rect x="18" y="15" width="2" height="2" fill="#ffffff"/>
  <rect x="21" y="15" width="2" height="2" fill="#ffffff"/>
  <rect x="17" y="17" width="2" height="2" fill="#ffffff"/>
  <rect x="22" y="17" width="2" height="2" fill="#ffffff"/>

  <!-- Rage Aura Sparks (Enrage / 激怒) -->
  <rect x="6" y="14" width="2" height="2" fill="#f97316"/>
  <rect x="33" y="6" width="2" height="2" fill="#f97316"/>
  <rect x="27" y="32" width="2" height="2" fill="#ef4444"/>
</svg>
