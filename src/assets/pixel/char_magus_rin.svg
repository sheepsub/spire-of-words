<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" width="100%" height="100%">
  <defs>
    <!-- Raven Black Hair Gradient -->
    <linearGradient id="rinHair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="35%" stop-color="#1e293b"/>
      <stop offset="80%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Crimson Coat Gradient -->
    <linearGradient id="rinRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="35%" stop-color="#ef4444"/>
      <stop offset="75%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <!-- Magic Circuit Cyan Glow -->
    <linearGradient id="circuitCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <radialGradient id="manaAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#ef4444" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#991b1b" stop-opacity="0"/>
    </radialGradient>

    <!-- Fair Soft Anime Skin -->
    <linearGradient id="rinSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>

    <filter id="circuitGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Mana Ripple & Circuit Aura -->
  <circle cx="160" cy="190" r="130" fill="url(#manaAura)" opacity="0.22" filter="url(#circuitGlow)"/>

  <!-- Magic Circuit Circles (魔术回路光环) -->
  <g filter="url(#circuitGlow)" opacity="0.75">
    <circle cx="95" cy="225" r="28" fill="none" stroke="url(#circuitCyan)" stroke-width="1.8" stroke-dasharray="8 4"/>
    <circle cx="95" cy="225" r="18" fill="none" stroke="#e0f2fe" stroke-width="1.2"/>
    <circle cx="225" cy="225" r="28" fill="none" stroke="url(#circuitCyan)" stroke-width="1.8" stroke-dasharray="8 4"/>
    <circle cx="225" cy="225" r="18" fill="none" stroke="#e0f2fe" stroke-width="1.2"/>
  </g>

  <!-- Ground Shadow -->
  <ellipse cx="160" cy="405" rx="70" ry="11" fill="#000000" opacity="0.55"/>
  <ellipse cx="160" cy="405" rx="45" ry="7" fill="#ef4444" opacity="0.25" filter="url(#circuitGlow)"/>

  <!-- ================= FLOATING ELEMENTAL MAGIC GEMS ================= -->
  <!-- Ruby (Fire - Left High) -->
  <g transform="translate(65, 140)" filter="url(#circuitGlow)">
    <polygon points="12,0 24,8 18,24 6,24 0,8" fill="#dc2626"/>
    <polygon points="12,3 20,9 16,21 8,21 4,9" fill="#f87171"/>
    <circle cx="12" cy="12" r="3" fill="#ffffff"/>
  </g>
  <!-- Sapphire (Water - Right High) -->
  <g transform="translate(235, 135)" filter="url(#circuitGlow)">
    <polygon points="10,0 20,10 10,20 0,10" fill="#2563eb"/>
    <polygon points="10,3 17,10 10,17 3,10" fill="#93c5fd"/>
    <circle cx="10" cy="10" r="2.5" fill="#ffffff"/>
  </g>
  <!-- Emerald (Wind - Left Mid) -->
  <g transform="translate(45, 250)" filter="url(#circuitGlow)">
    <polygon points="8,0 16,8 8,22 0,8" fill="#16a34a"/>
    <polygon points="8,3 13,8 8,18 3,8" fill="#86efac"/>
  </g>
  <!-- Topaz (Earth - Right Mid) -->
  <g transform="translate(255, 260)" filter="url(#circuitGlow)">
    <polygon points="10,0 20,6 16,18 4,18 0,6" fill="#ca8a04"/>
    <polygon points="10,3 16,7 13,15 7,15 4,7" fill="#fef08a"/>
  </g>

  <!-- ================= BODY & ATTIRE ================= -->
  <!-- Flowing Twin-Tails Back Layer -->
  <path d="M120,100 Q60,170 70,300 Q82,310 90,270 Q80,180 130,120 Z" fill="url(#rinHair)"/>
  <path d="M200,100 Q260,170 250,300 Q238,310 230,270 Q240,180 190,120 Z" fill="url(#rinHair)"/>

  <!-- Slender Legs: Thigh-High Stockings & Absolute Territory (绝对领域) -->
  <!-- Left Leg -->
  <g>
    <!-- Fair Skin Gap (Zettai Ryouiki) -->
    <path d="M142,260 L138,290 L156,290 L156,260 Z" fill="url(#rinSkin)"/>
    <!-- Black Over-Knee Stocking -->
    <path d="M138,290 L135,360 L130,395 L152,395 L155,360 L156,290 Z" fill="#09090b"/>
    <line x1="138" y1="292" x2="156" y2="292" stroke="#27272a" stroke-width="2"/>
    <!-- Black Leather Loafer -->
    <path d="M128,392 Q142,388 154,392 L152,402 L124,402 Z" fill="#18181b"/>
  </g>
  <!-- Right Leg -->
  <g>
    <!-- Fair Skin Gap -->
    <path d="M164,260 L164,290 L182,290 L178,260 Z" fill="url(#rinSkin)"/>
    <!-- Black Over-Knee Stocking -->
    <path d="M164,290 L165,360 L168,395 L190,395 L185,360 L182,290 Z" fill="#09090b"/>
    <line x1="164" y1="292" x2="182" y2="292" stroke="#27272a" stroke-width="2"/>
    <!-- Right Shoe -->
    <path d="M166,392 Q178,388 192,392 L194,402 L164,402 Z" fill="#18181b"/>
  </g>

  <!-- Black Pleated Mini-Skirt -->
  <path d="M136,220 Q160,215 184,220 L198,265 Q160,275 122,265 Z" fill="#09090b"/>
  <!-- Skirt Pleats -->
  <line x1="135" y1="222" x2="132" y2="265" stroke="#27272a" stroke-width="1.8"/>
  <line x1="148" y1="220" x2="148" y2="268" stroke="#27272a" stroke-width="1.8"/>
  <line x1="160" y1="220" x2="160" y2="270" stroke="#27272a" stroke-width="1.8"/>
  <line x1="172" y1="220" x2="172" y2="268" stroke="#27272a" stroke-width="1.8"/>
  <line x1="185" y1="222" x2="188" y2="265" stroke="#27272a" stroke-width="1.8"/>

  <!-- ICONIC CRIMSON RED HIGH-NECK COAT (远坂凛经典鲜红高领风衣) -->
  <path d="M136,160 Q160,154 184,160 L188,225 Q160,230 132,225 Z" fill="url(#rinRed)"/>
  <!-- High Turtleneck Collar -->
  <polygon points="148,155 160,146 172,155 166,164 154,164" fill="url(#rinRed)"/>
  <line x1="154" y1="164" x2="166" y2="164" stroke="#991b1b" stroke-width="1.5"/>
  <!-- White Cross Motif on Chest -->
  <rect x="157" y="172" width="6" height="22" fill="#ffffff" rx="1"/>
  <rect x="148" y="178" width="24" height="6" fill="#ffffff" rx="1"/>

  <!-- Left Arm: Hand raised channeling magic jewel -->
  <path d="M132,165 L102,198 L110,206 L138,180 Z" fill="url(#rinRed)"/>
  <path d="M102,198 L92,222 L100,226 L110,206 Z" fill="url(#rinRed)"/>
  <!-- Slender Left Hand with Mana Spark -->
  <ellipse cx="94" cy="226" rx="6" ry="5" fill="url(#rinSkin)"/>
  <circle cx="94" cy="226" r="3" fill="#38bdf8" filter="url(#circuitGlow)"/>

  <!-- Right Arm: Pointing forward commanding elemental barrage -->
  <path d="M188,165 L218,198 L210,206 L182,180 Z" fill="url(#rinRed)"/>
  <path d="M218,198 L228,222 L220,226 L210,206 Z" fill="url(#rinRed)"/>
  <!-- Slender Right Hand with Mana Spark -->
  <ellipse cx="226" cy="226" rx="6" ry="5" fill="url(#rinSkin)"/>
  <circle cx="226" cy="226" r="3" fill="#38bdf8" filter="url(#circuitGlow)"/>

  <!-- ================= HEAD & CHARISMATIC ANIME FACE ================= -->
  <!-- Neck -->
  <path d="M153,138 L153,156 L167,156 L167,138 Z" fill="url(#rinSkin)"/>

  <!-- Beautiful Anime Face Contour -->
  <path d="M144,105 Q140,126 148,142 L160,154 L172,142 Q180,126 176,105 Z" fill="url(#rinSkin)"/>

  <!-- Cute Rosy Blush -->
  <ellipse cx="146" cy="130" rx="5.5" ry="3.5" fill="#f43f5e" opacity="0.38"/>
  <ellipse cx="174" cy="130" rx="5.5" ry="3.5" fill="#f43f5e" opacity="0.38"/>

  <!-- Nose & Confident Cheerful Anime Smile -->
  <path d="M159,127 L160,131 L158,132" stroke="#d97706" stroke-width="1" fill="none"/>
  <!-- Playful, Confident Smile Line -->
  <path d="M154,138 Q160,143 166,138" stroke="#be123c" stroke-width="1.6" fill="none" stroke-linecap="round"/>

  <!-- RADIANT AQUA-BLUE ANIME EYES (澄澈深邃的碧蓝宝石双眸) -->
  <!-- Left Eye -->
  <g>
    <path d="M146,118 Q152,114 157,119 Q151,126 146,118 Z" fill="#ffffff"/>
    <ellipse cx="152" cy="120" rx="4" ry="4.5" fill="#0369a1"/>
    <ellipse cx="152" cy="120" rx="3" ry="3.5" fill="#38bdf8"/>
    <!-- Eye Highlights -->
    <circle cx="150" cy="118" r="1.5" fill="#ffffff"/>
    <circle cx="153.5" cy="122.5" r="1" fill="#bae6fd"/>
    <!-- Eyelash & Brow -->
    <path d="M144,118 Q151,113 158,118" stroke="#0f172a" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M144,112 Q151,109 157,113" stroke="#1e293b" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Right Eye -->
  <g>
    <path d="M163,119 Q168,114 174,118 Q169,126 163,119 Z" fill="#ffffff"/>
    <ellipse cx="168" cy="120" rx="4" ry="4.5" fill="#0369a1"/>
    <ellipse cx="168" cy="120" rx="3" ry="3.5" fill="#38bdf8"/>
    <!-- Eye Highlights -->
    <circle cx="166" cy="118" r="1.5" fill="#ffffff"/>
    <circle cx="169.5" cy="122.5" r="1" fill="#bae6fd"/>
    <!-- Eyelash & Brow -->
    <path d="M162,118 Q169,113 176,118" stroke="#0f172a" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M163,113 Q169,109 176,112" stroke="#1e293b" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  </g>

  <!-- ================= RAVEN-BLACK TWIN-TAILS WITH CRIMSON RIBBONS ================= -->
  <!-- Top Head Hair -->
  <path d="M140,82 Q160,68 180,82 L186,102 Q160,94 134,102 Z" fill="url(#rinHair)"/>

  <!-- Forehead Bangs & Side Locks -->
  <path d="M136,92 Q146,108 142,128 Q148,116 150,102 Z" fill="url(#rinHair)"/>
  <path d="M184,92 Q174,108 178,128 Q172,116 170,102 Z" fill="url(#rinHair)"/>
  <path d="M146,92 Q156,108 158,114 Q160,105 166,94 Z" fill="url(#rinHair)"/>
  <path d="M164,94 Q168,108 170,116 Q172,105 178,94 Z" fill="url(#rinHair)"/>

  <!-- Left Twin-Tail & Crimson Silk Ribbon -->
  <g>
    <!-- Crimson Ribbon Bow -->
    <polygon points="122,86 112,78 116,92 124,90" fill="#dc2626"/>
    <polygon points="122,86 130,78 128,92 120,90" fill="#dc2626"/>
    <circle cx="122" cy="86" r="3" fill="#ef4444"/>
    <!-- Cascading Black Twin-Tail -->
    <path d="M120,88 Q85,130 92,240 Q105,250 108,210 Q98,150 126,100 Z" fill="url(#rinHair)"/>
    <path d="M96,140 Q102,180 100,220" stroke="#475569" stroke-width="1" fill="none"/>
  </g>

  <!-- Right Twin-Tail & Crimson Silk Ribbon -->
  <g>
    <!-- Crimson Ribbon Bow -->
    <polygon points="198,86 188,78 192,92 200,90" fill="#dc2626"/>
    <polygon points="198,86 208,78 204,92 196,90" fill="#dc2626"/>
    <circle cx="198" cy="86" r="3" fill="#ef4444"/>
    <!-- Cascading Black Twin-Tail -->
    <path d="M200,88 Q235,130 228,240 Q215,250 212,210 Q222,150 194,100 Z" fill="url(#rinHair)"/>
    <path d="M224,140 Q218,180 220,220" stroke="#475569" stroke-width="1" fill="none"/>
  </g>

  <!-- Floating Magic Circuit Sparkles -->
  <g filter="url(#circuitGlow)">
    <circle cx="105" cy="140" r="2.5" fill="#f87171"/>
    <circle cx="215" cy="130" r="3" fill="#38bdf8"/>
    <circle cx="260" cy="220" r="2" fill="#ffffff"/>
    <circle cx="65" cy="280" r="2.5" fill="#38bdf8"/>
    <circle cx="240" cy="340" r="2" fill="#f87171"/>
    <circle cx="160" cy="380" r="3" fill="#ffffff"/>
  </g>
</svg>
