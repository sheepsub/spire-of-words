<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Stardew Valley Chibi: Toxic Alchemist / 菲欧娜 -->
  <!-- Soft ground shadow with slight toxic green glow -->
  <ellipse cx="24" cy="45" rx="12" ry="3" fill="#000000" opacity="0.45" shape-rendering="geometricPrecision"/>
  <ellipse cx="24" cy="45" rx="9" ry="2" fill="#22c55e" opacity="0.2" shape-rendering="geometricPrecision"/>

  <!-- Tiny Dark Boots -->
  <rect x="18" y="41" width="4" height="4" fill="#14532d"/>
  <rect x="18" y="43" width="5" height="2" fill="#166534"/>
  <rect x="26" y="41" width="4" height="4" fill="#14532d"/>
  <rect x="25" y="43" width="5" height="2" fill="#166534"/>

  <!-- Alchemist Robes & Leather Apron (Chibi proportions) -->
  <rect x="17" y="29" width="14" height="12" fill="#15803d"/>
  <rect x="19" y="30" width="10" height="11" fill="#16a34a"/>
  <!-- Brown Leather Potion Belt -->
  <rect x="16" y="35" width="16" height="3" fill="#78350f"/>
  <rect x="23" y="35" width="2" height="3" fill="#facc15"/>
  <!-- Bubbling Potion Flasks attached to belt -->
  <rect x="15" y="36" width="3" height="4" fill="#22c55e"/>
  <rect x="16" y="37" width="1" height="2" fill="#86efac"/>
  <rect x="19" y="36" width="3" height="4" fill="#a855f7"/>
  <rect x="20" y="37" width="1" height="2" fill="#e9d5ff"/>
  <rect x="26" y="36" width="3" height="4" fill="#38bdf8"/>
  <rect x="27" y="37" width="1" height="2" fill="#bae6fd"/>

  <!-- Left Arm Holding Stirring Wand -->
  <rect x="13" y="31" width="4" height="4" fill="#16a34a"/>
  <rect x="12" y="34" width="3" height="3" fill="#fed7aa"/>
  <rect x="11" y="27" width="2" height="10" fill="#92400e"/>
  <rect x="10" y="25" width="4" height="3" fill="#4ade80"/>

  <!-- Right Arm Holding Glowing Toxic Flask -->
  <rect x="31" y="31" width="4" height="4" fill="#16a34a"/>
  <rect x="33" y="33" width="3" height="3" fill="#fed7aa"/>
  <!-- Round Glass Flask -->
  <rect x="34" y="27" width="3" height="3" fill="#cbd5e1"/>
  <rect x="32" y="30" width="7" height="7" fill="#15803d"/>
  <rect x="33" y="31" width="5" height="5" fill="#22c55e"/>
  <rect x="34" y="32" width="3" height="3" fill="#4ade80"/>
  <rect x="35" y="32" width="1" height="1" fill="#ffffff"/>
  <!-- Toxic Bubbles floating up -->
  <rect x="35" y="24" width="2" height="2" fill="#86efac"/>
  <rect x="38" y="21" width="2" height="2" fill="#4ade80"/>
  <rect x="32" y="21" width="1" height="1" fill="#a855f7"/>

  <!-- Cape / Mantle behind head -->
  <rect x="14" y="24" width="20" height="7" fill="#14532d"/>

  <!-- BIG CHIBI HEAD (Warm cute tones) -->
  <rect x="14" y="11" width="20" height="18" fill="#ffedd5"/>
  <rect x="15" y="10" width="18" height="20" fill="#fed7aa"/>

  <!-- Cute Big Stardew Eyes (Emerald Green with sparkles) -->
  <!-- Left Eye -->
  <rect x="18" y="18" width="3" height="5" fill="#064e3b"/>
  <rect x="18" y="19" width="3" height="3" fill="#059669"/>
  <rect x="19" y="18" width="1" height="2" fill="#ffffff"/>
  <!-- Right Eye -->
  <rect x="27" y="18" width="3" height="5" fill="#064e3b"/>
  <rect x="27" y="19" width="3" height="3" fill="#059669"/>
  <rect x="28" y="18" width="1" height="2" fill="#ffffff"/>

  <!-- Pink Rosy Blushing Cheeks -->
  <rect x="16" y="23" width="3" height="2" fill="#fb7185" opacity="0.7"/>
  <rect x="29" y="23" width="3" height="2" fill="#fb7185" opacity="0.7"/>
  <!-- Winking / Mischievous Tiny Mouth -->
  <rect x="23" y="24" width="3" height="2" fill="#be123c"/>
  <rect x="24" y="24" width="1" height="1" fill="#ffffff"/>

  <!-- Soft Auburn Hair Curled at Sides -->
  <rect x="13" y="14" width="4" height="12" fill="#b45309"/>
  <rect x="31" y="14" width="4" height="12" fill="#b45309"/>
  <rect x="17" y="13" width="3" height="4" fill="#d97706"/>
  <rect x="28" y="13" width="3" height="4" fill="#d97706"/>

  <!-- Cute Forest Green Alchemist Hood / Beret with Sprout -->
  <rect x="12" y="6" width="24" height="8" fill="#15803d"/>
  <rect x="14" y="4" width="20" height="4" fill="#16a34a"/>
  <rect x="18" y="3" width="12" height="2" fill="#22c55e"/>
  <!-- Tiny Botanical Leaf Sprout on top of hat (Super cute Stardew vibe!) -->
  <rect x="23" y="0" width="2" height="3" fill="#4ade80"/>
  <rect x="21" y="1" width="3" height="2" fill="#86efac"/>
  <rect x="24" y="0" width="3" height="2" fill="#86efac"/>
</svg>
