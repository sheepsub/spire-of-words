<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Hexaghost / 六角幽冥领主 16-bit Pixel Art -->
  <!-- Floating Ethereal Shadow on floor -->
  <ellipse cx="24" cy="45" rx="14" ry="3" fill="#000000" opacity="0.4" shape-rendering="geometricPrecision"/>

  <!-- Spectral Outer Aura (Hovering Ghost) -->
  <rect x="16" y="16" width="16" height="16" fill="#3b0764" opacity="0.4"/>
  <rect x="18" y="14" width="12" height="20" fill="#581c87" opacity="0.5"/>
  <rect x="14" y="18" width="20" height="12" fill="#581c87" opacity="0.5"/>

  <!-- Central Obsidian Geometric Core (Hexagonal Shape) -->
  <rect x="20" y="17" width="8" height="14" fill="#09090b"/>
  <rect x="18" y="19" width="12" height="10" fill="#09090b"/>
  <rect x="16" y="21" width="16" height="6" fill="#18181b"/>
  <rect x="19" y="18" width="10" height="12" fill="#27272a"/>

  <!-- Core Dark Facets & Highlights -->
  <rect x="21" y="20" width="6" height="8" fill="#3f3f46"/>
  <rect x="22" y="21" width="4" height="6" fill="#52525b"/>

  <!-- Central Arcane Eye / Core Glyph (Flaming Purple/White) -->
  <rect x="23" y="22" width="2" height="4" fill="#c084fc"/>
  <rect x="22" y="23" width="4" height="2" fill="#c084fc"/>
  <rect x="23" y="23" width="2" height="2" fill="#ffffff"/>

  <!-- SIX ORBITING SOUL FLAMES (6 六道冥火) -->

  <!-- Flame 1: Top (12 o'clock) -->
  <rect x="23" y="4" width="2" height="5" fill="#38bdf8"/>
  <rect x="22" y="6" width="4" height="4" fill="#818cf8"/>
  <rect x="23" y="6" width="2" height="3" fill="#ffffff"/>
  <rect x="24" y="3" width="1" height="2" fill="#bae6fd"/>

  <!-- Flame 2: Top-Right (2 o'clock) -->
  <rect x="36" y="9" width="3" height="4" fill="#818cf8"/>
  <rect x="37" y="10" width="2" height="3" fill="#c084fc"/>
  <rect x="37" y="11" width="1" height="2" fill="#ffffff"/>
  <rect x="38" y="8" width="1" height="2" fill="#e0e7ff"/>

  <!-- Flame 3: Bottom-Right (4 o'clock) -->
  <rect x="36" y="29" width="4" height="4" fill="#818cf8"/>
  <rect x="37" y="30" width="2" height="3" fill="#38bdf8"/>
  <rect x="38" y="31" width="1" height="2" fill="#ffffff"/>
  <rect x="39" y="28" width="1" height="2" fill="#bae6fd"/>

  <!-- Flame 4: Bottom (6 o'clock) -->
  <rect x="23" y="36" width="2" height="5" fill="#a855f7"/>
  <rect x="22" y="37" width="4" height="3" fill="#818cf8"/>
  <rect x="23" y="37" width="2" height="2" fill="#ffffff"/>
  <rect x="24" y="40" width="1" height="2" fill="#e9d5ff"/>

  <!-- Flame 5: Bottom-Left (8 o'clock) -->
  <rect x="8" y="29" width="4" height="4" fill="#818cf8"/>
  <rect x="9" y="30" width="2" height="3" fill="#38bdf8"/>
  <rect x="9" y="31" width="1" height="2" fill="#ffffff"/>
  <rect x="8" y="28" width="1" height="2" fill="#bae6fd"/>

  <!-- Flame 6: Top-Left (10 o'clock) -->
  <rect x="9" y="9" width="3" height="4" fill="#818cf8"/>
  <rect x="9" y="10" width="2" height="3" fill="#c084fc"/>
  <rect x="10" y="11" width="1" height="2" fill="#ffffff"/>
  <rect x="9" y="8" width="1" height="2" fill="#e0e7ff"/>

  <!-- Orbiting Rune Sparks -->
  <rect x="15" y="11" width="1" height="1" fill="#38bdf8"/>
  <rect x="32" y="11" width="1" height="1" fill="#a855f7"/>
  <rect x="33" y="35" width="1" height="1" fill="#38bdf8"/>
  <rect x="14" y="35" width="1" height="1" fill="#a855f7"/>
</svg>
