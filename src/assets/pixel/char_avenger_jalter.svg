<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" width="100%" height="100%">
  <defs>
    <!-- Ash-Silver Hair Gradient -->
    <linearGradient id="jalterHair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#e2e8f0"/>
      <stop offset="85%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Gothic Black Armor Gradients -->
    <linearGradient id="gothicBlack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="40%" stop-color="#27272a"/>
      <stop offset="85%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="purpleGoth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6b21a8"/>
      <stop offset="60%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Dragon Hellfire Flame Gradients -->
    <linearGradient id="hellfireFlame" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#701a75"/>
      <stop offset="35%" stop-color="#c026d3"/>
      <stop offset="70%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#fdf4ff"/>
    </linearGradient>
    <linearGradient id="dragonCrimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="60%" stop-color="#be185d"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </linearGradient>

    <!-- Pale Cool Skin Tone -->
    <linearGradient id="jalterSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#fdf4ff"/>
      <stop offset="100%" stop-color="#f5d0fe"/>
    </linearGradient>

    <filter id="flameGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Dark Hellfire Aura -->
  <circle cx="160" cy="200" r="130" fill="url(#purpleGoth)" opacity="0.25" filter="url(#flameGlow)"/>

  <!-- Ground Shadow with Hellfire Embers -->
  <ellipse cx="160" cy="405" rx="75" ry="12" fill="#000000" opacity="0.6"/>
  <ellipse cx="160" cy="405" rx="55" ry="8" fill="#a21caf" opacity="0.3" filter="url(#flameGlow)"/>

  <!-- ================= THE DRAGON WITCH WAR BANNER (HELLFIRE FLAG) ================= -->
  <!-- Flagpole held in Right Hand, extending high -->
  <g id="dragonBanner">
    <!-- Tall Black Iron Lance Staff -->
    <line x1="225" y1="20" x2="215" y2="400" stroke="#334155" stroke-width="4.5" stroke-linecap="round"/>
    <polygon points="225,12 230,28 220,28" fill="#e2e8f0"/>

    <!-- Massive Flowing Ragged Black Flag -->
    <path d="M225,28 Q270,35 305,65 Q275,100 295,140 Q255,120 222,150 Z" fill="#09090b"/>
    <path d="M225,32 Q265,40 295,68 Q270,98 288,135 Q252,118 222,142 Z" fill="#18181b"/>
    <!-- Crimson Dragon Crest on Banner -->
    <path d="M245,60 Q265,55 275,70 Q265,85 250,80 Q255,95 240,90 Q245,75 245,60 Z" fill="url(#dragonCrimson)"/>

    <!-- Roaring Dark Purple/Magenta Hellfire on Banner Edge -->
    <g filter="url(#flameGlow)">
      <path d="M290,55 Q315,35 305,75 Q325,60 300,105 Q320,115 290,145 Q285,125 295,120 Z" fill="url(#hellfireFlame)" opacity="0.85"/>
      <path d="M230,140 Q250,165 240,185 Q230,160 220,150 Z" fill="url(#hellfireFlame)" opacity="0.8"/>
      <!-- Sparks of Hellfire -->
      <circle cx="305" cy="40" r="3" fill="#fdf4ff"/>
      <circle cx="280" cy="160" r="2.5" fill="#e879f9"/>
      <circle cx="315" cy="95" r="2" fill="#c026d3"/>
    </g>
  </g>

  <!-- ================= BODY & GOTHIC ARMOR ================= -->
  <!-- Ragged Dark Violet Cape flowing from shoulders -->
  <path d="M125,170 Q95,250 85,370 Q115,360 135,325 Q130,240 135,170 Z" fill="url(#purpleGoth)"/>
  <path d="M195,170 Q215,250 205,335 Q185,325 185,240 Q180,185 180,170 Z" fill="url(#purpleGoth)"/>

  <!-- Left: Black Obsidian Dark Sword -->
  <g transform="translate(85, 230) rotate(-15)" filter="url(#flameGlow)">
    <polygon points="10,0 14,0 13,150 12,160 11,150" fill="#09090b"/>
    <polygon points="11,5 13,5 12,150" fill="#c026d3"/>
    <!-- Guard -->
    <polygon points="0,0 24,0 20,8 4,8" fill="#3f3f46"/>
    <!-- Hilt & Pommel -->
    <rect x="10" y="-18" width="4" height="18" fill="#18181b"/>
    <polygon points="8,-18 16,-18 12,-24" fill="#a21caf"/>
  </g>

  <!-- Black Armored Greaves & Sabatons (Legs) -->
  <!-- Left Leg -->
  <g>
    <path d="M136,290 L132,360 L128,395 L150,395 L152,360 L150,290 Z" fill="url(#gothicBlack)"/>
    <polygon points="126,325 154,325 150,350 130,350" fill="#27272a"/>
    <polygon points="128,335 152,335 148,340 132,340" fill="#a21caf"/>
    <path d="M130,392 Q142,388 152,392 L148,402 L124,402 Z" fill="#09090b"/>
  </g>
  <!-- Right Leg -->
  <g>
    <path d="M170,290 L168,360 L170,395 L192,395 L188,360 L184,290 Z" fill="url(#gothicBlack)"/>
    <polygon points="166,325 194,325 190,350 170,350" fill="#27272a"/>
    <polygon points="168,335 192,335 188,340 172,340" fill="#a21caf"/>
    <path d="M168,392 Q180,388 194,392 L196,402 L164,402 Z" fill="#09090b"/>
  </g>

  <!-- Gothic Black Ballgown / Battle Skirt with Spiked Plating -->
  <path d="M130,220 Q160,215 190,220 L212,355 Q160,370 108,355 Z" fill="url(#gothicBlack)"/>
  <!-- Dark Purple Underlayer -->
  <path d="M145,225 L175,225 L180,355 Q160,360 140,355 Z" fill="url(#purpleGoth)"/>
  <!-- Silver Spikes and Belts on Skirt -->
  <line x1="115" y1="350" x2="205" y2="350" stroke="#a21caf" stroke-width="2"/>
  <polygon points="140,280 150,295 130,295" fill="#3f3f46"/>
  <polygon points="180,280 190,295 170,295" fill="#3f3f46"/>

  <!-- Gothic Spiked Corset / Cuirass (Chestplate) -->
  <path d="M135,160 Q160,152 185,160 L188,225 Q160,230 132,225 Z" fill="url(#gothicBlack)"/>
  <!-- Silver Gothic Accents on Breastplate -->
  <path d="M142,165 Q160,160 178,165 L174,195 Q160,200 146,195 Z" fill="#27272a"/>
  <path d="M152,170 L168,170 L160,190 Z" fill="#be185d"/>

  <!-- Left Arm: Holding Black Sword -->
  <path d="M130,170 L100,215 L108,222 L136,185 Z" fill="url(#gothicBlack)"/>
  <polygon points="98,212 110,224 104,230 92,218" fill="#3f3f46"/>

  <!-- Right Arm: Raising the Dragon Flagstaff -->
  <path d="M188,170 L215,200 L222,192 L198,165 Z" fill="url(#gothicBlack)"/>
  <polygon points="212,196 226,204 220,212 208,204" fill="#3f3f46"/>

  <!-- ================= HEAD & ANIME FACE ================= -->
  <path d="M153,138 L153,156 L167,156 L167,138 Z" fill="url(#jalterSkin)"/>

  <!-- Sharp, Elegant Anime Face (Pale Skin, Confident Chin) -->
  <path d="M144,105 Q140,126 148,142 L160,154 L172,142 Q180,126 176,105 Z" fill="url(#jalterSkin)"/>

  <!-- Nose & Rebellious Tsundere Pout/Smirk -->
  <path d="M159,127 L160,131 L158,132" stroke="#94a3b8" stroke-width="1" fill="none"/>
  <!-- Pouty, Mocking Smirk Line -->
  <path d="M154,138 Q162,142 168,136" stroke="#9d174d" stroke-width="1.8" fill="none" stroke-linecap="round"/>

  <!-- PIERCING GOLDEN / AMBER EYES (金曜邪龙魔眸) -->
  <!-- Left Eye -->
  <g>
    <path d="M146,118 Q152,114 157,119 Q151,126 146,118 Z" fill="#ffffff"/>
    <ellipse cx="152" cy="120" rx="4" ry="4.5" fill="#78350f"/>
    <ellipse cx="152" cy="120" rx="3" ry="3.5" fill="#d97706"/>
    <!-- Eye Highlights -->
    <circle cx="150" cy="118" r="1.5" fill="#fef08a"/>
    <!-- Sharp Winged Eyeliner -->
    <path d="M143,118 Q151,113 158,118" stroke="#09090b" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M144,111 Q151,109 157,113" stroke="#27272a" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Right Eye -->
  <g>
    <path d="M163,119 Q168,114 174,118 Q169,126 163,119 Z" fill="#ffffff"/>
    <ellipse cx="168" cy="120" rx="4" ry="4.5" fill="#78350f"/>
    <ellipse cx="168" cy="120" rx="3" ry="3.5" fill="#d97706"/>
    <!-- Eye Highlights -->
    <circle cx="166" cy="118" r="1.5" fill="#fef08a"/>
    <!-- Sharp Winged Eyeliner -->
    <path d="M162,118 Q169,113 177,118" stroke="#09090b" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M163,113 Q169,109 176,111" stroke="#27272a" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- ================= ASH-SILVER SHORT HAIR & BLACK CORONET ================= -->
  <!-- Short Jagged Bob Hair -->
  <path d="M136,92 Q130,118 138,140 Q146,130 144,106 Z" fill="url(#jalterHair)"/>
  <path d="M184,92 Q190,118 182,140 Q174,130 176,106 Z" fill="url(#jalterHair)"/>
  <path d="M140,80 Q160,65 180,80 L186,100 Q160,92 134,100 Z" fill="url(#jalterHair)"/>

  <!-- Jagged Spiky Bangs across forehead -->
  <path d="M142,92 Q148,110 150,118 Q154,106 158,95 Z" fill="url(#jalterHair)"/>
  <path d="M156,94 Q162,112 165,120 Q168,106 172,94 Z" fill="url(#jalterHair)"/>
  <path d="M170,92 Q176,108 178,116 Q180,105 184,92 Z" fill="url(#jalterHair)"/>

  <!-- BLACK IRON DRAGON TIARA / CORONET (黑色铁之龙角头冠) -->
  <path d="M138,82 Q160,70 182,82 L180,90 Q160,80 140,90 Z" fill="#09090b"/>
  <!-- Coronet Dragon Horn Spikes -->
  <polygon points="138,82 132,65 144,80" fill="#09090b"/>
  <polygon points="182,82 188,65 176,80" fill="#09090b"/>
  <polygon points="158,74 160,60 162,74" fill="#09090b"/>
  <circle cx="160" cy="80" r="3" fill="#be185d"/>

  <!-- Floating Dark Hellfire Particles -->
  <g filter="url(#flameGlow)">
    <circle cx="100" cy="180" r="2.5" fill="#c026d3"/>
    <circle cx="210" cy="140" r="3" fill="#e879f9"/>
    <circle cx="70" cy="290" r="2.5" fill="#f43f5e"/>
    <circle cx="240" cy="330" r="2.5" fill="#c026d3"/>
    <circle cx="150" cy="385" r="2" fill="#ffffff"/>
  </g>
</svg>
