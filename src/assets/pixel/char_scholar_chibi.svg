<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Stardew Valley Chibi: Scholar Warrior / 艾尔文 -->
  <!-- Soft ground shadow -->
  <ellipse cx="24" cy="45" rx="12" ry="3" fill="#000000" opacity="0.45" shape-rendering="geometricPrecision"/>

  <!-- Boots & Tiny Legs -->
  <rect x="18" y="41" width="4" height="4" fill="#1e1b4b"/>
  <rect x="18" y="43" width="5" height="2" fill="#312e81"/>
  <rect x="26" y="41" width="4" height="4" fill="#1e1b4b"/>
  <rect x="25" y="43" width="5" height="2" fill="#312e81"/>

  <!-- Scholar Tunic & Belt (Chibi Body: compact & adorable) -->
  <rect x="17" y="29" width="14" height="12" fill="#1d4ed8"/>
  <rect x="19" y="30" width="10" height="11" fill="#2563eb"/>
  <rect x="17" y="36" width="14" height="2" fill="#ca8a04"/>
  <rect x="23" y="35" width="2" height="4" fill="#fef08a"/>
  <!-- Silver Chestplate Trim -->
  <rect x="20" y="29" width="8" height="6" fill="#cbd5e1"/>
  <rect x="21" y="30" width="6" height="4" fill="#f1f5f9"/>

  <!-- Left Arm holding Arcane Spellbook -->
  <rect x="13" y="30" width="4" height="4" fill="#1d4ed8"/>
  <rect x="11" y="33" width="3" height="3" fill="#fcd34d"/>
  <!-- Open Spellbook (Chibi glowing book) -->
  <rect x="7" y="32" width="7" height="9" fill="#78350f"/>
  <rect x="8" y="33" width="5" height="7" fill="#fef9c3"/>
  <rect x="9" y="35" width="3" height="1" fill="#3b82f6"/>
  <rect x="9" y="37" width="3" height="1" fill="#3b82f6"/>
  <!-- Magic Glow from book -->
  <rect x="6" y="30" width="2" height="2" fill="#60a5fa"/>
  <rect x="10" y="29" width="2" height="2" fill="#93c5fd"/>

  <!-- Right Arm holding Runic Little Sword -->
  <rect x="31" y="30" width="4" height="4" fill="#1d4ed8"/>
  <rect x="34" y="33" width="3" height="3" fill="#fcd34d"/>
  <!-- Runic Blade -->
  <rect x="34" y="23" width="3" height="11" fill="#38bdf8"/>
  <rect x="35" y="20" width="1" height="14" fill="#ffffff"/>
  <rect x="32" y="34" width="7" height="2" fill="#ca8a04"/>
  <rect x="35" y="36" width="1" height="3" fill="#78350f"/>

  <!-- Cape / Mantle behind head -->
  <rect x="14" y="24" width="20" height="7" fill="#1e3a8a"/>

  <!-- BIG CHIBI HEAD (Classic Stardew proportions) -->
  <rect x="14" y="11" width="20" height="18" fill="#ffedd5"/>
  <rect x="15" y="10" width="18" height="20" fill="#fed7aa"/>

  <!-- Cute Expressive Stardew Eyes -->
  <!-- Left Eye -->
  <rect x="18" y="18" width="3" height="5" fill="#1e293b"/>
  <rect x="19" y="19" width="1" height="2" fill="#ffffff"/>
  <!-- Right Eye -->
  <rect x="27" y="18" width="3" height="5" fill="#1e293b"/>
  <rect x="28" y="19" width="1" height="2" fill="#ffffff"/>

  <!-- Cute Blushing Cheeks -->
  <rect x="16" y="23" width="3" height="2" fill="#f43f5e" opacity="0.65"/>
  <rect x="29" y="23" width="3" height="2" fill="#f43f5e" opacity="0.65"/>
  <!-- Happy Tiny Smile -->
  <rect x="23" y="24" width="2" height="1" fill="#9a3412"/>

  <!-- Messy Hero Hair & Blue Headband (Stardew Villager charm) -->
  <rect x="13" y="7" width="22" height="7" fill="#78350f"/>
  <rect x="12" y="9" width="24" height="6" fill="#92400e"/>
  <rect x="11" y="12" width="4" height="8" fill="#78350f"/>
  <rect x="33" y="12" width="4" height="8" fill="#78350f"/>
  <!-- Spiky Bangs on forehead -->
  <rect x="15" y="13" width="4" height="4" fill="#92400e"/>
  <rect x="21" y="13" width="3" height="5" fill="#b45309"/>
  <rect x="26" y="13" width="4" height="3" fill="#92400e"/>
  <!-- Blue Headband -->
  <rect x="14" y="14" width="20" height="2" fill="#3b82f6"/>
  <rect x="34" y="14" width="2" height="4" fill="#60a5fa"/>
</svg>
