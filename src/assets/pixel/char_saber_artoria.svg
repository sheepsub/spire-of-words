<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" width="100%" height="100%">
  <defs>
    <!-- Royal Blue Gown Gradient -->
    <linearGradient id="saberBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="40%" stop-color="#1d4ed8"/>
      <stop offset="85%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Silver Armor Gradients -->
    <linearGradient id="saberSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Gold Filigree Trim -->
    <linearGradient id="saberGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>

    <!-- Golden Hair Gradient -->
    <linearGradient id="artoriaHair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="40%" stop-color="#fde047"/>
      <stop offset="80%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Excalibur Holy Light -->
    <radialGradient id="holyAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="40%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>

    <!-- Invisible Air Wind Swirl -->
    <linearGradient id="windSwirl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </linearGradient>

    <!-- Fair Anime Skin Tone -->
    <linearGradient id="artoriaSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>

    <filter id="holyGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Holy Light Halo -->
  <circle cx="160" cy="180" r="130" fill="url(#holyAura)" opacity="0.18" filter="url(#holyGlow)"/>

  <!-- Swirling Wind Ribbons (Invisible Air / 风王结界) -->
  <path d="M70,160 Q100,100 160,110 Q230,120 250,180 Q260,260 210,320 Q160,360 110,330 Q60,290 70,220" 
        fill="none" stroke="url(#windSwirl)" stroke-width="4.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M100,200 Q120,130 180,140 Q240,160 230,240 Q220,310 160,330" 
        fill="none" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round" opacity="0.75" filter="url(#holyGlow)"/>

  <!-- Ground Shadow -->
  <ellipse cx="160" cy="405" rx="70" ry="11" fill="#000000" opacity="0.55"/>
  <ellipse cx="160" cy="405" rx="45" ry="7" fill="#38bdf8" opacity="0.25" filter="url(#holyGlow)"/>

  <!-- ================= BODY & ATTIRE ================= -->
  <!-- Blue Mantle Cape (flowing behind) -->
  <path d="M120,170 Q90,260 80,380 Q115,370 135,330 Q130,240 135,170 Z" fill="url(#saberBlue)"/>
  <path d="M200,170 Q230,260 240,380 Q205,370 185,330 Q190,240 185,170 Z" fill="url(#saberBlue)"/>
  <!-- Gold trim on cape edges -->
  <path d="M80,380 Q95,350 110,365" stroke="url(#saberGold)" stroke-width="2.5" fill="none"/>
  <path d="M240,380 Q225,350 210,365" stroke="url(#saberGold)" stroke-width="2.5" fill="none"/>

  <!-- Silver Sabatons / Greaves (Legs) -->
  <g>
    <!-- Left Leg -->
    <path d="M136,290 L132,360 L128,395 L150,395 L152,360 L150,290 Z" fill="url(#saberSilver)"/>
    <path d="M130,392 Q142,388 152,392 L148,402 L124,402 Z" fill="url(#saberSilver)"/>
    <!-- Right Leg -->
    <path d="M170,290 L168,360 L170,395 L192,395 L188,360 L184,290 Z" fill="url(#saberSilver)"/>
    <path d="M168,392 Q180,388 194,392 L196,402 L164,402 Z" fill="url(#saberSilver)"/>
  </g>

  <!-- Royal Blue Battle Ballgown Skirt with Pleats -->
  <path d="M130,220 Q160,215 190,220 L215,355 Q160,370 105,355 Z" fill="url(#saberBlue)"/>
  <!-- Gold Filigree Embroidery on Skirt Hem -->
  <path d="M105,355 Q160,370 215,355" stroke="url(#saberGold)" stroke-width="4" fill="none"/>
  <path d="M110,348 Q160,363 210,348" stroke="url(#saberGold)" stroke-width="1.5" fill="none"/>
  <!-- White & Gold Center Inset Panel -->
  <path d="M148,225 L172,225 L178,358 Q160,362 142,358 Z" fill="#ffffff"/>
  <path d="M152,230 L168,230 L172,350 Q160,354 148,350 Z" fill="#f8fafc"/>
  <line x1="160" y1="230" x2="160" y2="352" stroke="url(#saberGold)" stroke-width="2"/>

  <!-- Silver Side Hip Armor (Faulds) with Blue Gem Accents -->
  <path d="M125,225 Q115,260 120,290 L142,280 L138,225 Z" fill="url(#saberSilver)"/>
  <polygon points="120,290 130,285 142,280 135,295" fill="url(#saberGold)"/>
  <circle cx="130" cy="285" r="2.5" fill="#1d4ed8"/>

  <path d="M195,225 Q205,260 200,290 L178,280 L182,225 Z" fill="url(#saberSilver)"/>
  <polygon points="200,290 190,285 178,280 185,295" fill="url(#saberGold)"/>
  <circle cx="190" cy="285" r="2.5" fill="#1d4ed8"/>

  <!-- Silver Cuirass / Corset (Polished Chest Armor) -->
  <path d="M135,160 Q160,152 185,160 L188,225 Q160,230 132,225 Z" fill="url(#saberSilver)"/>
  <!-- Gold Fleur-de-lis / Crest on Chestplate -->
  <path d="M160,170 Q152,185 160,195 Q168,185 160,170" fill="url(#saberGold)"/>
  <circle cx="160" cy="182" r="2.5" fill="#1d4ed8"/>
  <line x1="148" y1="185" x2="172" y2="185" stroke="url(#saberGold)" stroke-width="1.8"/>

  <!-- High Blue & Silver Neck Collar -->
  <polygon points="148,155 160,146 172,155 166,162 154,162" fill="url(#saberSilver)"/>
  <path d="M152,156 Q160,150 168,156" stroke="url(#saberGold)" stroke-width="1.5" fill="none"/>

  <!-- Silver Pauldrons (Shoulders) with Gold Borders -->
  <g>
    <!-- Left Shoulder -->
    <path d="M135,155 Q115,150 110,180 Q128,190 140,175 Z" fill="url(#saberSilver)"/>
    <path d="M110,180 Q125,190 140,175" stroke="url(#saberGold)" stroke-width="2" fill="none"/>
    <!-- Right Shoulder -->
    <path d="M185,155 Q205,150 210,180 Q192,190 180,175 Z" fill="url(#saberSilver)"/>
    <path d="M210,180 Q195,190 180,175" stroke="url(#saberGold)" stroke-width="2" fill="none"/>
  </g>

  <!-- ================= EXCALIBUR (SWORD OF PROMISED VICTORY) ================= -->
  <!-- Excalibur planted upright in front of Saber, held with two hands -->
  <g id="excalibur" filter="url(#holyGlow)">
    <!-- Holy Aura behind Blade -->
    <line x1="160" y1="180" x2="160" y2="390" stroke="#fef08a" stroke-width="12" opacity="0.3" stroke-linecap="round"/>
    <!-- Radiant Golden Blade -->
    <polygon points="156,220 164,220 162,385 160,395 158,385" fill="#ffffff"/>
    <polygon points="154,220 166,220 163,380 160,392 157,380" fill="url(#saberGold)" opacity="0.85"/>
    <line x1="160" y1="220" x2="160" y2="385" stroke="#ffffff" stroke-width="1.8"/>

    <!-- Golden Crossguard with Blue Inset -->
    <polygon points="140,215 180,215 175,225 160,222 145,225" fill="url(#saberGold)"/>
    <rect x="156" y="217" width="8" height="6" fill="#1d4ed8"/>
    <!-- Grip / Hilt -->
    <rect x="158" y="195" width="4" height="20" fill="#1e3a8a"/>
    <!-- Pommel -->
    <circle cx="160" cy="193" r="5" fill="url(#saberGold)"/>
    <circle cx="160" cy="193" r="2.5" fill="#38bdf8"/>
  </g>

  <!-- Saber's Silver Gauntlets Gripping Hilt (Two hands on sword) -->
  <g>
    <!-- Left Hand -->
    <ellipse cx="155" cy="202" rx="7" ry="6" fill="url(#saberSilver)"/>
    <circle cx="155" cy="202" r="3" fill="url(#saberGold)"/>
    <!-- Arm from left -->
    <path d="M125,180 L150,200 L146,208 L120,188 Z" fill="url(#saberSilver)"/>

    <!-- Right Hand -->
    <ellipse cx="165" cy="206" rx="7" ry="6" fill="url(#saberSilver)"/>
    <circle cx="165" cy="206" r="3" fill="url(#saberGold)"/>
    <!-- Arm from right -->
    <path d="M195,180 L170,204 L174,212 L200,188 Z" fill="url(#saberSilver)"/>
  </g>

  <!-- ================= HEAD & ANIME FACE ================= -->
  <!-- Neck -->
  <path d="M153,138 L153,156 L167,156 L167,138 Z" fill="url(#artoriaSkin)"/>

  <!-- Beautiful Anime Head (Soft Porcelain Skin, Elegant Chin) -->
  <path d="M144,105 Q140,126 148,142 L160,154 L172,142 Q180,126 176,105 Z" fill="url(#artoriaSkin)"/>

  <!-- Soft Anime Blush -->
  <ellipse cx="146" cy="130" rx="6" ry="3.5" fill="#f43f5e" opacity="0.35"/>
  <ellipse cx="174" cy="130" rx="6" ry="3.5" fill="#f43f5e" opacity="0.35"/>

  <!-- Nose & Delicate Mouth -->
  <path d="M159,127 L160,131 L158,132" stroke="#d97706" stroke-width="1" fill="none"/>
  <!-- Resolute, Gentle Anime Smile -->
  <path d="M155,138 Q160,141 165,138" stroke="#be123c" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- EMERALD GREEN EYES (碧绿清澈王者之眸) -->
  <!-- Left Eye -->
  <g>
    <path d="M146,118 Q152,114 157,119 Q151,126 146,118 Z" fill="#ffffff"/>
    <ellipse cx="152" cy="120" rx="4" ry="4.5" fill="#047857"/>
    <ellipse cx="152" cy="120" rx="3" ry="3.5" fill="#10b981"/>
    <!-- Eye Highlights -->
    <circle cx="150" cy="118" r="1.5" fill="#ffffff"/>
    <circle cx="153.5" cy="122.5" r="1" fill="#a7f3d0"/>
    <!-- Eyelash & Brow -->
    <path d="M144,118 Q151,113 158,118" stroke="#78350f" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M144,112 Q151,109 157,113" stroke="#b45309" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Right Eye -->
  <g>
    <path d="M163,119 Q168,114 174,118 Q169,126 163,119 Z" fill="#ffffff"/>
    <ellipse cx="168" cy="120" rx="4" ry="4.5" fill="#047857"/>
    <ellipse cx="168" cy="120" rx="3" ry="3.5" fill="#10b981"/>
    <!-- Eye Highlights -->
    <circle cx="166" cy="118" r="1.5" fill="#ffffff"/>
    <circle cx="169.5" cy="122.5" r="1" fill="#a7f3d0"/>
    <!-- Eyelash & Brow -->
    <path d="M162,118 Q169,113 176,118" stroke="#78350f" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M163,113 Q169,109 176,112" stroke="#b45309" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  </g>

  <!-- ================= GOLDEN BRAIDED HAIR & THE AHOGE ================= -->
  <!-- Back Bun -->
  <circle cx="160" cy="78" r="24" fill="url(#artoriaHair)"/>
  <circle cx="160" cy="78" r="20" fill="none" stroke="#b45309" stroke-width="2"/>
  <!-- Royal Blue Hair Ribbon behind Bun -->
  <path d="M142,75 Q125,65 130,85 Q140,85 145,80" fill="url(#saberBlue)"/>
  <path d="M178,75 Q195,65 190,85 Q180,85 175,80" fill="url(#saberBlue)"/>
  <!-- Ribbon Tails flowing -->
  <path d="M136,80 Q120,110 115,140 Q125,130 138,90 Z" fill="url(#saberBlue)"/>
  <path d="M184,80 Q200,110 205,140 Q195,130 182,90 Z" fill="url(#saberBlue)"/>

  <!-- Braided Crown around head -->
  <path d="M134,88 Q160,75 186,88 Q160,82 134,88" fill="url(#saberGold)"/>
  <!-- Elegant Front Bangs & Side Locks -->
  <path d="M134,92 Q144,106 142,125 Q146,115 150,102 Z" fill="url(#artoriaHair)"/>
  <path d="M186,92 Q176,106 178,125 Q174,115 170,102 Z" fill="url(#artoriaHair)"/>
  <!-- Forehead Bangs -->
  <path d="M144,92 Q154,106 156,112 Q158,104 163,94 Z" fill="url(#artoriaHair)"/>
  <path d="M162,94 Q166,106 168,114 Q170,104 176,94 Z" fill="url(#artoriaHair)"/>

  <!-- THE ICONIC AHOGE (灵动呆毛王灵魂之毛) -->
  <path d="M160,76 Q156,45 166,35 Q176,28 174,38 Q170,48 163,74 Z" 
        fill="url(#artoriaHair)" stroke="#b45309" stroke-width="0.8"/>
  <path d="M166,35 Q172,30 170,36" stroke="#ffffff" stroke-width="1.2" fill="none"/>

  <!-- Floating Starlight Sparkles -->
  <g filter="url(#holyGlow)">
    <circle cx="105" cy="140" r="2.5" fill="#fef08a"/>
    <circle cx="215" cy="130" r="3" fill="#67e8f9"/>
    <circle cx="250" cy="220" r="2" fill="#ffffff"/>
    <circle cx="75" cy="270" r="2.5" fill="#67e8f9"/>
    <circle cx="240" cy="330" r="2.5" fill="#fef08a"/>
    <circle cx="160" cy="380" r="3" fill="#ffffff"/>
  </g>
</svg>
