<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Acid Slime / 酸液软泥怪 16-bit Pixel Art -->
  <!-- Toxic Puddle Shadow -->
  <ellipse cx="24" cy="42" rx="16" ry="4" fill="#064e3b" opacity="0.6" shape-rendering="geometricPrecision"/>
  <ellipse cx="24" cy="42" rx="13" ry="2.5" fill="#022c22" opacity="0.8" shape-rendering="geometricPrecision"/>

  <!-- Slime Base Silhouette -->
  <rect x="12" y="36" width="24" height="6" fill="#14532d"/>
  <rect x="10" y="32" width="28" height="7" fill="#15803d"/>
  <rect x="8" y="27" width="32" height="7" fill="#16a34a"/>
  <rect x="10" y="21" width="28" height="9" fill="#22c55e"/>
  <rect x="14" y="16" width="20" height="7" fill="#4ade80"/>
  <rect x="18" y="12" width="12" height="6" fill="#86efac"/>
  <rect x="21" y="9" width="6" height="4" fill="#bbf7d0"/>
  <rect x="23" y="7" width="2" height="3" fill="#dcfce7"/>

  <!-- Dripping Gelatinous Tendrils on sides -->
  <rect x="7" y="34" width="3" height="5" fill="#15803d"/>
  <rect x="8" y="38" width="2" height="3" fill="#16a34a"/>
  <rect x="38" y="33" width="3" height="6" fill="#15803d"/>
  <rect x="39" y="37" width="2" height="4" fill="#16a34a"/>

  <!-- Translucent Inner Core (Toxic Acid Glow) -->
  <rect x="14" y="24" width="20" height="12" fill="#22c55e"/>
  <rect x="16" y="26" width="16" height="9" fill="#4ade80"/>
  <rect x="18" y="28" width="12" height="6" fill="#86efac"/>
  <rect x="20" y="30" width="8" height="3" fill="#fef08a"/>

  <!-- Menacing Slime Eyes -->
  <!-- Left Eye -->
  <rect x="16" y="21" width="5" height="5" fill="#052e16"/>
  <rect x="17" y="22" width="3" height="3" fill="#facc15"/>
  <rect x="18" y="23" width="2" height="2" fill="#ef4444"/>
  <rect x="19" y="22" width="1" height="1" fill="#ffffff"/>

  <!-- Right Eye -->
  <rect x="27" y="21" width="5" height="5" fill="#052e16"/>
  <rect x="28" y="22" width="3" height="3" fill="#facc15"/>
  <rect x="28" y="23" width="2" height="2" fill="#ef4444"/>
  <rect x="28" y="22" width="1" height="1" fill="#ffffff"/>

  <!-- Grumpy/Vicious Slime Mouth -->
  <rect x="20" y="27" width="8" height="2" fill="#052e16"/>
  <rect x="21" y="28" width="6" height="2" fill="#022c22"/>
  <!-- Toxic Drip from Mouth -->
  <rect x="23" y="30" width="2" height="3" fill="#bbf7d0"/>

  <!-- Glossy Specular Highlights (Classic Retro Slime Shine) -->
  <rect x="16" y="16" width="4" height="2" fill="#ffffff"/>
  <rect x="15" y="18" width="2" height="3" fill="#ffffff"/>
  <rect x="17" y="17" width="3" height="2" fill="#dcfce7"/>

  <!-- Bubbling Toxic Spores / Acid Droplets floating -->
  <rect x="9" y="17" width="2" height="2" fill="#86efac"/>
  <rect x="10" y="18" width="1" height="1" fill="#ffffff"/>
  <rect x="36" y="14" width="3" height="3" fill="#4ade80"/>
  <rect x="37" y="15" width="1" height="1" fill="#ffffff"/>
  <rect x="33" y="8" width="2" height="2" fill="#86efac"/>
</svg>
