name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build iOS App (.ipa)
        run: |
          cd ios/App
          if [ -d "App.xcworkspace" ]; then
            BUILD_TARGET="-workspace App.xcworkspace"
          else
            BUILD_TARGET="-project App.xcodeproj"
          fi
          echo "Using build target: $BUILD_TARGET"
          xcodebuild $BUILD_TARGET \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE="Manual"

          mkdir -p Payload
          cp -r App.xcarchive/Products/Applications/App.app Payload/
          zip -r SpireOfWords.ipa Payload/


      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpireOfWords-iOS-IPA
          path: ios/App/SpireOfWords.ipa
