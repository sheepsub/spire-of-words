name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build iOS App (.ipa)
        run: |
          cd ios/App
          if [ -d "App.xcworkspace" ]; then
            BUILD_TARGET="-workspace App.xcworkspace"
          else
            BUILD_TARGET="-project App.xcodeproj"
          fi
          echo "Using build target: $BUILD_TARGET"

          # Resolve Swift Package Manager dependencies
          xcodebuild -resolvePackageDependencies $BUILD_TARGET -scheme App || true

          # Build release application bundle without code signing requirement
          xcodebuild build \
            $BUILD_TARGET \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath ./DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE="Manual" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

          # Find the compiled .app bundle
          APP_PATH=$(find ./DerivedData/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not find compiled .app in DerivedData!"
            exit 1
          fi
          echo "Found compiled app at: $APP_PATH"

          # Package into IPA
          rm -rf Payload SpireOfWords.ipa
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/

          # Ad-hoc sign bundle for sideloading compatibility (TrollStore, AltStore, Sideloadly)
          codesign --force --deep --sign - Payload/*.app 2>/dev/null || true

          zip -qr SpireOfWords.ipa Payload
          echo "Successfully generated SpireOfWords.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpireOfWords-iOS-IPA
          path: ios/App/SpireOfWords.ipa
